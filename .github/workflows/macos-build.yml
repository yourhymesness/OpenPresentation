name: macOS build and model checks

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build OpenPresentation without code signing
        run: |
          xcodebuild -project OpenPresentation.xcodeproj \
            -scheme OpenPresentation -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Run eight-handle geometry test
        run: |
          swiftc OpenPresentation/Core/PresentationSlide.swift \
            OpenPresentation/Core/CanvasSnapping.swift \
            Tests/LayerGeometryEightHandles.swift -o /tmp/layer-geometry
          /tmp/layer-geometry
      - name: Run existing show compatibility test
        run: |
          swiftc OpenPresentation/Core/PresentationSlide.swift \
            OpenPresentation/Storage/ProjectStore.swift \
            Tests/ModelCompatibility.swift -o /tmp/show-compatibility
          /tmp/show-compatibility
      - name: Test non-destructive font hover preview
        run: |
          swiftc OpenPresentation/Core/PresentationSlide.swift \
            Tests/FontHoverPreview.swift -o /tmp/font-hover-preview
          /tmp/font-hover-preview
      - name: Test media stretch and fixed-proportion shapes
        run: |
          swiftc OpenPresentation/Core/PresentationSlide.swift \
            OpenPresentation/Core/CanvasSnapping.swift \
            Tests/MediaStretchAndShapes.swift -o /tmp/media-shape-tests
          /tmp/media-shape-tests
      - name: Test canvas presets, geometry and legacy show migration
        run: |
          swiftc OpenPresentation/Core/PresentationSlide.swift \
            OpenPresentation/Core/CanvasSnapping.swift \
            OpenPresentation/Storage/ProjectStore.swift \
            Tests/CanvasSizePersistence.swift -o /tmp/canvas-size-tests
          /tmp/canvas-size-tests
      - name: Test zoom math and text outline persistence
        run: |
          swiftc OpenPresentation/Core/PresentationSlide.swift \
            OpenPresentation/Core/CanvasZoom.swift \
            Tests/CanvasZoomAndTextOutline.swift -o /tmp/zoom-outline
          /tmp/zoom-outline
      - name: Test autosave snapshots and crash recovery
        run: |
          swiftc OpenPresentation/Core/PresentationSlide.swift \
            OpenPresentation/Storage/RecoverySnapshotStore.swift \
            Tests/AutosaveCrashRecovery.swift -o /tmp/autosave-recovery
          /tmp/autosave-recovery
      - name: Test dBFS conversion and combined meter math
        run: |
          swiftc OpenPresentation/Core/SignalMeterMath.swift \
            Tests/AudioMeterMath.swift -o /tmp/audio-meter-math
          /tmp/audio-meter-math
      - name: Test pre/post-fader meter stages, smoothing and peak bounds
        run: |
          swiftc OpenPresentation/Core/SignalMeterMath.swift \
            Tests/MeterRedesignTests.swift -o /tmp/meter-redesign
          /tmp/meter-redesign
      - name: Test video output priority, audio-tap gating and drift cooldown
        run: |
          swiftc OpenPresentation/Core/PresentationSlide.swift \
            OpenPresentation/Core/VideoTakePlanner.swift \
            Tests/VideoPlaybackWorkloadTests.swift -o /tmp/video-workload
          /tmp/video-workload
      - name: Test adaptive peak bars at 60, 120 and 144 Hz
        run: |
          swiftc OpenPresentation/Core/SignalMeterMath.swift \
            Tests/RefreshAdaptivePeakMeterTests.swift -o /tmp/peak-refresh
          /tmp/peak-refresh
